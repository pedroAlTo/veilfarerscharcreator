# The encyclopedia rules data is private too; otherwise the JSON could still be
# fetched directly even when the HTML page is protected.
[[redirects]]
from = "/reference-data/*"
to = "/reference-data/:splat"
status = 200
force = true
conditions = {Role = ["friend", "admin"]}

[[redirects]]
from = "/reference-data/*"
to = "/login.html"
status = 302
force = true

# The Hearts in the Void source text is consumed by the Keeper Tool. It is not
# public reading material, so it carries the same role condition as the tool.
[[redirects]]
from = "/adventures/*"
to = "/adventures/:splat"
status = 200
force = true
conditions = {Role = ["keeper", "admin"]}

[[redirects]]
from = "/adventures/*"
to = "/login.html"
status = 302
force = true

# Baseline public-site hardening. Inline/eval remain temporarily necessary for the current
# inline application scripts; Player Tool JSX and Tailwind are precompiled for production.
[[headers]]
for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  X-DNS-Prefetch-Control = "off"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "accelerometer=(self), gyroscope=(self), camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"
  Cross-Origin-Opener-Policy = "same-origin-allow-popups"
  X-VeilFarers-Release = "v59.82"
  X-VeilFarers-CSP-Profile = "wasm-3d-dice-v2"
  Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://docs.google.com; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://www.gstatic.com https://identity.netlify.com https://scripts.simpleanalyticscdn.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://queue.simpleanalyticscdn.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://www.gstatic.com https://identity.netlify.com https://api.netlify.com https://*.netlify.com https://queue.simpleanalyticscdn.com; frame-src 'self' https://identity.netlify.com https://app.netlify.com https://docs.google.com; worker-src 'self' blob:; media-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"

[[headers]]
for = "/*.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/player-tool.html"
  [headers.values]
  Cache-Control = "private, no-store"
  X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
for = "/keeper-tool.html"
  [headers.values]
  Cache-Control = "private, no-store"
  X-Robots-Tag = "noindex, nofollow, noarchive"

