functionsDirectory = "netlify/functions"
functionsDirectoryOrigin = "default"
plugins = []

[build]
publish = "public"
publishOrigin = "config"
functions = "netlify/functions"

  # Firebase Web SDK configuration is deliberately returned to authenticated
  # browsers by /api/firebase-config. These identifiers are public application
  # configuration, not server credentials. Keep Firebase service accounts,
  # VF_ADMIN_EMAIL and every other environment variable inside secret scanning.
  [build.environment]
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_API_KEY,FIREBASE_APP_ID,FIREBASE_AUTH_DOMAIN,FIREBASE_MEASUREMENT_ID,FIREBASE_MESSAGING_SENDER_ID,FIREBASE_PROJECT_ID,FIREBASE_STORAGE_BUCKET"
  # The administrator email is also the published legal/privacy contact. Allow
  # it only in these intentional public references and in the unpublished docs/
  # folder, while scanning every other path.
  SECRETS_SCAN_OMIT_PATHS = "public/legal.html,public/login.html,public/portal.js,docs/"

  [build.processing]
    [build.processing.css]
    [build.processing.html]
    [build.processing.images]
    [build.processing.js]
  [build.services]

[functions]
  [functions."*"]

# Every authenticated account receives the base member role. It does not grant
# protected-tool access. Player, keeper and admin are explicit Identity roles.
# The same role policy is rechecked inside every sensitive server function.
[[redirects]]
from = "/player-tool"
to = "/player-tool.html"
status = 200
force = true
conditions = {Role = ["player", "admin"]}

[[redirects]]
from = "/player-tool"
to = "/login.html"
status = 302
force = true

[[redirects]]
from = "/player-tool.html"
to = "/player-tool.html"
status = 200
force = true
conditions = {Role = ["player", "admin"]}

[[redirects]]
from = "/player-tool.html"
to = "/login.html"
status = 302
force = true

[[redirects]]
from = "/keeper-tool"
to = "/keeper-tool.html"
status = 200
force = true
conditions = {Role = ["keeper", "admin"]}

[[redirects]]
from = "/keeper-tool"
to = "/login.html"
status = 302
force = true

[[redirects]]
from = "/keeper-tool.html"
to = "/keeper-tool.html"
status = 200
force = true
conditions = {Role = ["keeper", "admin"]}

[[redirects]]
from = "/keeper-tool.html"
to = "/login.html"
status = 302
force = true

[[redirects]]
from = "/admin"
to = "/admin.html"
status = 200
force = true
conditions = {Role = ["admin"]}

[[redirects]]
from = "/admin"
to = "/login.html"
status = 302
force = true

[[redirects]]
from = "/admin.html"
to = "/admin.html"
status = 200
force = true
conditions = {Role = ["admin"]}

[[redirects]]
from = "/admin.html"
to = "/login.html"
status = 302
force = true

