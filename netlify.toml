functionsDirectory = "netlify/functions"
functionsDirectoryOrigin = "default"
plugins = []

[build]
publish = "."
publishOrigin = "config"
functions = "netlify/functions"

  # Firebase Web SDK configuration is deliberately returned to authenticated
  # browsers by /api/firebase-config. These identifiers are public application
  # configuration, not server credentials. Keep Firebase service accounts,
  # VF_ADMIN_EMAIL and every other environment variable inside secret scanning.
  [build.environment]
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_API_KEY,FIREBASE_APP_ID,FIREBASE_AUTH_DOMAIN,FIREBASE_MEASUREMENT_ID,FIREBASE_MESSAGING_SENDER_ID,FIREBASE_PROJECT_ID,FIREBASE_STORAGE_BUCKET"
  # The administrator email is also the published legal/privacy contact. Allow
  # it only in these intentional public references while scanning every other path.
  SECRETS_SCAN_OMIT_PATHS = "LEGAL_LAUNCH_CHECKLIST_v59.79.md,LEGAL_LAUNCH_CHECKLIST_v59.80.md,PORTAL_HANDOVER_v59.79_CREATOR_LEGAL_SECURITY_PATCH.md,legal.html,login.html,portal.js"

  [build.processing]
    [build.processing.css]
    [build.processing.html]
    [build.processing.images]
    [build.processing.js]
  [build.services]

[functions]
  [functions."*"]

# Every authenticated account receives the base member role. It does not grant
# protected-tool access. Player, keeper and admin are explicit Identity roles.
# The same role policy is rechecked inside every sensitive server function.
[[redirects]]
from = "/player-tool"
to = "/player-tool.html"
status = 200
force = true
conditions = {Role = ["player", "admin"]}

[[redirects]]
from = "/player-tool"
to = "/login.html"
status = 302
force = true

[[redirects]]
from = "/player-tool.html"
to = "/player-tool.html"
status = 200
force = true
conditions = {Role = ["player", "admin"]}

[[redirects]]
from = "/player-tool.html"
to = "/login.html"
status = 302
force = true

[[redirects]]
from = "/keeper-tool"
to = "/keeper-tool.html"
status = 200
force = true
conditions = {Role = ["keeper", "admin"]}

[[redirects]]
from = "/keeper-tool"
to = "/login.html"
status = 302
force = true

[[redirects]]
from = "/keeper-tool.html"
to = "/keeper-tool.html"
status = 200
force = true
conditions = {Role = ["keeper", "admin"]}

[[redirects]]
from = "/keeper-tool.html"
to = "/login.html"
status = 302
force = true

[[redirects]]
from = "/admin"
to = "/admin.html"
status = 200
force = true
conditions = {Role = ["admin"]}

[[redirects]]
from = "/admin"
to = "/login.html"
status = 302
force = true

[[redirects]]
from = "/admin.html"
to = "/admin.html"
status = 200
force = true
conditions = {Role = ["admin"]}

[[redirects]]
from = "/admin.html"
to = "/login.html"
status = 302
force = true

# Baseline public-site hardening. Inline/eval remain temporarily necessary for the current
# inline application scripts; Player Tool JSX and Tailwind are precompiled for production.
[[headers]]
for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  X-DNS-Prefetch-Control = "off"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "accelerometer=(self), gyroscope=(self), camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"
  Cross-Origin-Opener-Policy = "same-origin-allow-popups"
  X-VeilFarers-Release = "v59.81"
  X-VeilFarers-CSP-Profile = "wasm-3d-dice-v2"
  Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://docs.google.com; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://www.gstatic.com https://identity.netlify.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://www.gstatic.com https://identity.netlify.com https://api.netlify.com https://*.netlify.com; frame-src 'self' https://identity.netlify.com https://app.netlify.com https://docs.google.com; worker-src 'self' blob:; media-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"

[[headers]]
for = "/*.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/player-tool.html"
  [headers.values]
  Cache-Control = "private, no-store"

[[headers]]
for = "/keeper-tool.html"
  [headers.values]
  Cache-Control = "private, no-store"

[[headers]]
for = "/admin.html"
  [headers.values]
  Cache-Control = "private, no-store"

[[headers]]
for = "/api/*"
  [headers.values]
  Cache-Control = "no-store"

[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/3d-dice/assets/ammo/*.wasm"
  [headers.values]
  Content-Type = "application/wasm"
  Cache-Control = "public, max-age=31536000, immutable"
  Cross-Origin-Resource-Policy = "same-origin"
