  Cache-Control = "no-store"

[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/3d-dice/assets/ammo/*.wasm"
  [headers.values]
  Content-Type = "application/wasm"
  Cache-Control = "public, max-age=31536000, immutable"
  Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
