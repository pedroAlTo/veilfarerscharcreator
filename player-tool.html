    <!-- Firebase SDK (VERSION COMPATIBILIDAD - MÁS ROBUSTA PARA ESTE ENTORNO) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <script>
        // La configuración de Firebase se sirve en tiempo de ejecución desde una
        // Netlify Function (/api/firebase-config) que lee los valores desde
        // variables de entorno. Así ninguna clave queda escrita en el repositorio.
        let firebaseConfigPromise = null;
        window.loadFirebaseConfig = async () => {
            if (!firebaseConfigPromise) {
                firebaseConfigPromise = fetch('/api/firebase-config')
                    .then((res) => {
                        if (!res.ok) throw new Error(`No se pudo cargar la configuración de Firebase (${res.status}).`);
                        return res.json();
                    })
                    .catch((err) => {
                        firebaseConfigPromise = null; // permitir reintento
                        throw err;
                    });
            }
            return firebaseConfigPromise;
        };

        // Inicialización global robusta con diagnóstico
        window.initFirebase = async (config) => {
            console.log("--- INICIANDO CONEXIÓN FIREBASE ---");
            try {
                if (!window.firebase) throw new Error("Librerías Firebase no cargadas.");

                // 0. Obtener configuración (desde variables de entorno vía función)
                const activeConfig = config || await window.loadFirebaseConfig();

                // 1. Inicializar App
                if (!firebase.apps.length) {
                    firebase.initializeApp(activeConfig);
                    console.log("App inicializada.");
                }

                const db = firebase.firestore();
                const auth = firebase.auth();
                
                // 2. Configurar Persistencia (SESSION es más seguro en iframes que LOCAL)
                await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

                // 3. Autenticación
                let user = auth.currentUser;
                if (!user) {
                    console.log("Intentando Login Anónimo...");
                    try {
                        const userCred = await auth.signInAnonymously();
                        user = userCred.user;
                        console.log("Login exitoso. UID:", user.uid);
                    } catch (authErr) {
                        console.error("Error Auth:", authErr.code, authErr.message);
                        throw new Error(`Authentication error (${authErr.code}): make sure 'Anonymous' sign-in is enabled in Firebase Console > Authentication.`);
                    }
                }

                console.log("Verificando acceso a Firestore...");
                
                return { 
                    db, auth, 
                    // CORRECCIÓN CRÍTICA 1: Ruta completa (mantenida del paso anterior)
                    doc: (db, ...path) => {
                        const fullPath = path.join('/');
                        console.log("Reference Doc Path:", fullPath); // Debug log
                        return db.doc(fullPath);
                    },
                    collection: (db, ...path) => {
                        const fullPath = path.join('/');
                        return db.collection(fullPath);
                    },
                    setDoc: (ref, data, opt) => ref.set(data, opt),
                    updateDoc: (ref, data) => ref.update(data),
                    onSnapshot: (ref, next, err) => ref.onSnapshot(next, err),
                    arrayUnion: (...args) => firebase.firestore.FieldValue.arrayUnion(...args)
                };

            } catch (e) {
                console.error("ERROR CRÍTICO:", e);
                throw e; 
            }
        };
    </script>

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .vf-player-topbar{overflow:visible!important;}
        .vf-player-tabs,.vf-player-tools{overflow:visible!important;}
        .vf-player-tabs>*{flex:0 0 auto;}
        .vf-player-tools>*{flex:0 0 auto;}
        .vf-player-tools button,.vf-player-tabs button{box-shadow:0 2px 8px rgba(0,0,0,.16);}
        @media (max-width:700px){.vf-player-tools{gap:.35rem}.vf-player-tools button{padding-left:.55rem!important;padding-right:.55rem!important}}

        /* Operational damage dice: weapon mechanics must remain visible in callouts. */
        .vf-damage-dice{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:.38rem;margin:.2rem 0;}
        .vf-damage-die{position:relative;display:flex;flex-direction:column;align-items:center;gap:.08rem;min-width:38px;padding:.18rem .16rem .1rem;border:1px solid transparent;border-radius:.55rem;transition:opacity .18s ease,filter .18s ease,box-shadow .18s ease,border-color .18s ease;}
        .vf-damage-die.is-kept{border-color:rgba(248,113,113,.65);background:rgba(127,29,29,.22);box-shadow:0 0 12px rgba(248,113,113,.18);}
        .vf-damage-die.is-discarded{opacity:.34;filter:grayscale(1) saturate(.15);border-color:rgba(100,116,139,.45);background:rgba(15,23,42,.42);}
        .vf-damage-die.is-discarded .vf-damage-die-face:after{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;background:#94a3b8;transform:rotate(-34deg);box-shadow:0 0 2px #020617;pointer-events:none;}
        .vf-damage-die-face{position:relative;display:grid;place-items:center;}
        .vf-damage-die-state{font-size:7px;line-height:1;font-weight:900;letter-spacing:.08em;text-transform:uppercase;}
        .vf-damage-die.is-kept .vf-damage-die-state{color:#fca5a5;}
        .vf-damage-die.is-discarded .vf-damage-die-state{color:#94a3b8;text-decoration:line-through;}
        .vf-damage-die-reroll{font-size:7px;line-height:1;color:#facc15;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
        .vf-damage-summary{font-size:8px;color:#cbd5e1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;}

        body { background-color: #020617; }
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); } 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); } }
        .status-online { animation: pulse-green 2s infinite; }
        .card-glow:hover { box-shadow: 0 0 20px rgba(6, 182, 212, 0.3); }
        
        @keyframes slide-up { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
        .toast-enter { animation: slide-up 0.5s ease-out forwards; }
        /* ===== LANTERN SPOTLIGHT SYSTEM =====
           States: OFF = lantern points up, unlit.
                   ON  = lens lights up + smooth rotation to aim at the character name.
           While ON: beam sways almost imperceptibly, faint dust motes drift in the light,
                     and every 6-10s the lamp flickers briefly (JS-scheduled, sporadic). */
        .vf-lantern { display:inline-block; width:18px; height:18px; vertical-align:middle; cursor:pointer; }
        .vf-lantern svg { display:block; overflow:visible; }
        .vf-lantern .vf-lantern-rot {
          transform-origin: 12px 12px;
          transform: rotate(0deg);                     /* OFF: facing up */
          transition: transform 0.8s cubic-bezier(0.45, 0.05, 0.25, 1.2);
        }
        .vf-lantern.on .vf-lantern-rot { transform: rotate(102deg); }  /* ON: aim at the name (to the right) */
        /* light parts: hidden when off, soft fade when switching */
        .vf-lantern .vf-beam, .vf-lantern .vf-lens-glow, .vf-lantern .vf-dust { opacity:0; transition: opacity 0.45s ease 0s; }
        .vf-lantern.on .vf-beam { opacity:1; transition-delay:0.7s; }        /* beam ignites once aimed at the name */
        .vf-lantern.on .vf-lens-glow { opacity:1; transition-delay:0.62s; } /* lens lights only in position */
        .vf-lantern.on .vf-dust { opacity:1; transition-delay:0.95s; }
        .vf-lantern .vf-lens-off { opacity:1; transition: opacity 0.3s ease 0s; }
        .vf-lantern.on .vf-lens-off { opacity:0; transition-delay:0.62s; }  /* stays dark through the swing */
        /* subtle sway of the light while on (max ±1.6deg, barely perceptible) */
        @keyframes vf-beam-sway { 0%,100% { transform: rotate(-0.8deg); } 50% { transform: rotate(0.8deg); } }
        .vf-lantern.on .vf-beam-group { transform-origin: 12px 8.5px; animation: vf-beam-sway 7s ease-in-out infinite; }
        /* very subtle breathing pulse of the light while on */
        @keyframes vf-light-pulse { 0%,100% { opacity:1; } 50% { opacity:0.86; } }
        .vf-lantern.on .vf-beam { animation: vf-light-pulse 3.4s ease-in-out infinite; }
        .vf-lantern.on .vf-glow-halo { animation: vf-light-pulse 3.4s ease-in-out 0.4s infinite; }
        /* dust motes drifting slowly through the beam */
        @keyframes vf-dust-drift { 0% { transform: translate(0,0); opacity:0; } 15% { opacity:0.5; } 60% { opacity:0.35; } 100% { transform: translate(1.5px,-7px); opacity:0; } }
        .vf-lantern .vf-dust circle { animation: vf-dust-drift 6s linear infinite; }
        .vf-lantern .vf-dust circle:nth-child(2) { animation-duration: 8s; animation-delay: 2.4s; }
        .vf-lantern .vf-dust circle:nth-child(3) { animation-duration: 7s; animation-delay: 4.2s; }
        /* flicker: JS applies .flicker for ~620ms every 6-10s. The light dies out in bursts
           while the lamp gets shaken (a few "hits" to make it work), then settles back to
           its tilted position and works as normal. */
        /* Sequenced flicker over 1.6s: (1) light stutters like it's breaking,
           (2) light cuts fully OFF, (3) lamp gets wiggled as if hit, (4) it flickers
           back and the beam returns to normal. Light + wash use the same timeline. */
        @keyframes vf-lamp-flicker {
          0% { opacity:1; } 2% { opacity:0.15; } 5% { opacity:0.85; } 8% { opacity:0.08; } 11% { opacity:0.6; }
          14% { opacity:0; } 60% { opacity:0; } /* fully off through the wiggle */
          64% { opacity:0.12; } 68% { opacity:0.02; } 73% { opacity:0.55; } 77% { opacity:0.12; }
          83% { opacity:0.85; } 88% { opacity:0.4; } 94% { opacity:0.95; } 100% { opacity:1; } }
        .vf-lantern.on.flicker .vf-beam, .vf-lantern.on.flicker .vf-lens-glow { animation: vf-lamp-flicker 1.6s steps(1,end) 1; }
        .vf-lantern.on.flicker .vf-glow-halo { animation: vf-lamp-flicker 1.6s steps(1,end) 1; }
        /* wiggle happens only while the light is off (~15%-60% of the timeline) */
        @keyframes vf-lamp-shake { 0%,14% { transform: rotate(0deg) translate(0,0); }
          20% { transform: rotate(-12deg) translate(-0.8px,0.5px); }
          27% { transform: rotate(10deg) translate(0.8px,-0.4px); }
          34% { transform: rotate(-9deg) translate(-0.6px,0.4px); }
          41% { transform: rotate(8deg) translate(0.6px,-0.3px); }
          48% { transform: rotate(-6deg) translate(-0.4px,0.3px); }
          55% { transform: rotate(4deg) translate(0.3px,0); }
          61% { transform: rotate(-1.5deg) translate(0,0); }
          67%,100% { transform: rotate(0deg) translate(0,0); } }
        .vf-lantern.on.flicker svg { animation: vf-lamp-shake 1.6s ease-in-out 1; transform-origin: 50% 70%; }
        .vf-lantern:hover .vf-body { stroke:rgb(var(--vf-spot-rgb, 253,224,71)); }
        /* spotlight colour driven by CSS vars (personal theme, set on the app root) */
        #root { --vf-spot-rgb: 253,224,71; --vf-spot-halo-rgb: 254,249,195; --vf-spot-lens-rgb: 254,240,138; --vf-spot-text: #3a2c00; }
        .vf-g-main { stop-color: rgb(var(--vf-spot-rgb, 253,224,71)); }
        .vf-g-halo { stop-color: rgb(var(--vf-spot-halo-rgb, 254,249,195)); }
        .vf-lens-lit { fill: rgb(var(--vf-spot-lens-rgb, 254,240,138)); stroke: rgb(var(--vf-spot-rgb, 253,224,71)); }
        /* tab wash = ONLY the flashlight's cone of light. Radial brightness at the lantern
           (left) masked to a forward wedge so nothing is lit behind the flashlight. */
        @keyframes vf-wash-flicker {
          0% { opacity:1; } 2% { opacity:0.12; } 5% { opacity:0.85; } 8% { opacity:0.06; } 11% { opacity:0.55; }
          14% { opacity:0; } 60% { opacity:0; }
          64% { opacity:0.1; } 68% { opacity:0.02; } 73% { opacity:0.5; } 77% { opacity:0.1; }
          83% { opacity:0.82; } 88% { opacity:0.35; } 94% { opacity:0.95; } 100% { opacity:1; } }
        .vf-tab-spot { position: relative; border-color:rgb(var(--vf-spot-rgb, 253,224,71)) !important; }
        .vf-tab-spot::before { content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
          background: radial-gradient(150% 175% at 27px 52%, rgba(var(--vf-spot-rgb, 253,224,71),0.95) 0%, rgba(var(--vf-spot-rgb, 253,224,71),0.42) 34%, rgba(var(--vf-spot-rgb, 253,224,71),0.12) 62%, rgba(var(--vf-spot-rgb, 253,224,71),0.02) 82%, transparent 92%);
          -webkit-mask: conic-gradient(from 0deg at 27px 52%, transparent 44deg, #000 66deg, #000 114deg, transparent 136deg);
          mask: conic-gradient(from 0deg at 27px 52%, transparent 44deg, #000 66deg, #000 114deg, transparent 136deg); }
        .vf-tab-spot > * { position: relative; z-index: 1; }
        .vf-tab-spot.flicker::before { animation: vf-wash-flicker 1.6s steps(1,end) 1; }
        .vf-tab-spot .vf-tabname { color:var(--vf-spot-text, #3a2c00) !important; font-weight:900 !important; text-shadow:0 1px 2px rgba(0,0,0,0.35); }
        @keyframes vf-tumble { 0% { transform: rotateX(0) rotateY(0) rotateZ(0) scale(0.6); } 30% { transform: rotateX(230deg) rotateY(180deg) rotateZ(80deg) scale(1.15); } 60% { transform: rotateX(430deg) rotateY(360deg) rotateZ(200deg) scale(0.95); } 100% { transform: rotateX(720deg) rotateY(720deg) rotateZ(360deg) scale(1); } }
        .vf-die { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:9px; font-weight:900; font-size:16px; transform-style:preserve-3d; }
        /* shaped die (SVG silhouette): tumbles in 3D while rolling, then settles */
        .vf-die3 { display:inline-flex; align-items:center; justify-content:center; transform-style:preserve-3d; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.45)); }
        .vf-die3 svg { display:block; overflow:visible; }
        .vf-die3.rolling { animation: vf-tumble 0.72s cubic-bezier(0.2,0.7,0.3,1); }
        /* Button press feedback: pronounced scale-up + glowing ring + brightness flash */
        @keyframes vf-btn-press { 0% { transform: scale(1); } 28% { transform: scale(1.13); box-shadow: 0 0 0 3px rgba(255,255,255,0.30), 0 0 20px 4px rgba(125,211,252,0.7); filter: brightness(1.35); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0); filter: brightness(1); } }
        .vf-btn-pressed { animation: vf-btn-press 0.42s cubic-bezier(0.3,0,0.3,1); z-index: 5; position: relative; }
        /* Resource particle + token fill flash */
        .vf-particle { position: fixed; left:0; top:0; width:11px; height:11px; border-radius:50%; pointer-events:none; z-index:300; will-change: transform, opacity; }
        .vf-token-flash { position: fixed; border-radius: 2px; pointer-events: none; z-index: 299; box-shadow: 0 0 12px 3px currentColor; }
        .vf-shard { position: fixed; left:0; top:0; width:6px; height:7px; pointer-events:none; z-index:301; clip-path: polygon(50% 0, 100% 70%, 18% 100%); }
        .vf-gather { position: fixed; left:0; top:0; width:6px; height:6px; border-radius:50%; background:#a5f3fc; box-shadow:0 0 6px 2px #67e8f9; pointer-events:none; z-index:301; will-change:transform,opacity; }
        .vf-shield-flash { position: fixed; left:0; top:0; pointer-events:none; z-index:302; clip-path: polygon(0 0, 100% 0, 100% 58%, 50% 100%, 0 58%); }
        /* Hide native number spinners everywhere; use custom up/down chevrons instead */
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
        input[type=number] { -moz-appearance:textfield; appearance:textfield; }
        .vf-num { position:relative; display:inline-flex; align-items:center; }
        .vf-num.vf-num-full { display:flex; width:100%; }
        .vf-num > input { padding-right:12px; }
        .vf-num.vf-num-full > input { width:100%; }
        .vf-num-btns { position:absolute; right:2px; top:0; height:100%; display:flex; flex-direction:column; justify-content:center; gap:1px; pointer-events:auto; z-index:30; }
        .vf-num-btns button { font-size:8px; line-height:0.7; color:#64748b; background:none; border:0; cursor:pointer; padding:0; height:9px; width:11px; display:flex; align-items:center; justify-content:center; transition:color 0.1s; }
        .vf-num-btns button:hover { color:#22d3ee; }
        .vf-num-btns button:active { transform:scale(1.3); }
        .vf-die.hope { background:linear-gradient(135deg,#22d3ee,#0e7490); color:#062c33; box-shadow:0 3px 10px rgba(8,145,178,0.55); }
        .vf-die.fear { background:linear-gradient(135deg,#c084fc,#6b21a8); color:#2a0a45; box-shadow:0 3px 10px rgba(126,34,206,0.55); }
        .vf-die.rolling { animation: vf-tumble 0.72s cubic-bezier(0.2,0.7,0.3,1); }
        .vf-chip { display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:30px; padding:0 4px; border-radius:50%; background:radial-gradient(circle at 50% 38%, #475569, #0f172a); border:3px dashed #f59e0b; color:#fbbf24; font-weight:900; font-size:11px; box-shadow:0 2px 7px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(245,158,11,0.15); }
        .window-shadow { box-shadow: 0 10px 40px -10px rgba(0,0,0,0.8); }
        .vf-callout-grid { position:fixed; right:14px; bottom:14px; z-index:180; display:grid; grid-template-columns:repeat(2,minmax(260px,320px)); gap:10px; max-height:calc(100vh - 80px); overflow:hidden; pointer-events:none; transform-origin:bottom right; }
        .vf-callout-card { pointer-events:auto; background:rgba(2,6,23,.94); backdrop-filter:blur(12px); border:1px solid #334155; border-left:3px solid #06b6d4; border-radius:12px; box-shadow:0 18px 45px rgba(0,0,0,.55); padding:10px; min-width:0; animation:vf-callout-in .22s ease-out; }
        .vf-callout-card[data-kind="damage"] { border-left-color:#ef4444; }
        .vf-callout-card[data-kind="note"] { border-left-color:#f59e0b; }
        @keyframes vf-callout-in { from { opacity:0; transform:translateY(12px) scale(.96); } to { opacity:1; transform:translateY(0) scale(1); } }
        .vf-callout-timer { height:2px; border-radius:99px; overflow:hidden; background:#1e293b; margin-top:8px; }
        .vf-callout-timer > span { display:block; height:100%; background:#06b6d4; animation:vf-callout-shrink 12s linear forwards; }
        @keyframes vf-callout-shrink { from { width:100%; } to { width:0%; } }
        .vf-stepper { display:inline-grid; grid-template-columns:32px minmax(72px,1fr) 32px; align-items:center; border:1px solid #334155; border-radius:9px; overflow:hidden; background:#020617; }
        .vf-stepper button { height:32px; color:#94a3b8; font-weight:900; background:#0f172a; transition:.15s; }
        .vf-stepper button:hover { color:#67e8f9; background:#1e293b; }
        .vf-stepper output { text-align:center; font-size:11px; font-weight:900; color:#e2e8f0; padding:0 6px; }
        .vf-3d-stage { position:fixed; inset:0; z-index:230; background:radial-gradient(circle at center,rgba(15,23,42,.88),rgba(0,0,0,.96)); display:flex; align-items:center; justify-content:center; padding:16px; }
        .vf-3d-canvas { position:absolute; inset:0; overflow:hidden; }
        .vf-3d-canvas canvas { width:100% !important; height:100% !important; display:block; }
        .vf-3d-hud { position:relative; z-index:2; align-self:flex-end; width:min(680px,94vw); margin-bottom:20px; border:1px solid #334155; border-radius:12px; background:rgba(2,6,23,.88); padding:12px; box-shadow:0 16px 40px rgba(0,0,0,.6); }
        @media (max-width:720px) { .vf-callout-grid { grid-template-columns:minmax(250px,320px); right:8px; bottom:8px; } }
    </style>
</head>
<body>
    <div id="root"><div style="padding:72px 24px;text-align:center;color:#94a3b8;font-family:system-ui">Loading canonical RC3 data…</div></div>

    

    <!-- Canonical RC3 data shared with the Creator, inventories and Keeper Tool -->
    <script src="shared-data.js"></script>
    <script src="canonical-runtime.js"></script>
    <script src="veilfarers-import.js"></script>

    <script type="text/babel">
        window.VeilFarersCanonical.ready.then(function(VF_CANON){
        const { useState, useEffect, useLayoutEffect, useRef } = React;
        const { User, Shield, Activity, Zap, Heart, Database, AlertCircle, Sparkles, Skull, Star, Plus, X, Cloud, CloudLightning, Link, Wifi, Dices, CreditCard, Save, Upload, Download, Crown, ScrollText, Pin, Minus, Move, Settings } = Icons;

        /* Dice geometry: each die is drawn as the silhouette of its real-world shape so a
           roll visibly "looks like" that die. d4 triangle, d6 square, d8 trapezoid,
           d10 rhombus, d12 pentagon, d20 twenty-sided (near-circle). */
        const regularPolygon = (n, rotDeg, cx, cy, r) => {
          const pts = [];
          for (let i = 0; i < n; i++) {
            const a = (rotDeg + i * 360 / n) * Math.PI / 180;
            pts.push([+(cx + r * Math.cos(a)).toFixed(2), +(cy + r * Math.sin(a)).toFixed(2)]);
          }
          return pts;
        };
        // returns { pts: outline, ty: text baseline, lines: [facet polylines] } for a 40x42 viewBox
        const dieShape = (sides) => {
          const s = parseInt(sides) || 20;
          let pts, ty = 25, lines = [];
          switch (s) {
            case 4:  pts = [[20,4],[37,34],[3,34]];                    ty = 29; break;   // triangle (point up)
            case 6:  pts = [[6,6],[34,6],[34,34],[6,34]];              ty = 24; break;   // square
            case 8:  // octahedron: diamond with an equator + top ridge (VTT d8 icon)
              pts = [[20,3],[34,21],[20,39],[6,21]]; ty = 32;
              lines = ['6,21 34,21', '20,3 20,21']; break;
            case 10: pts = [[20,3],[35,21],[20,39],[5,21]];            ty = 25; break;   // rhombus / diamond
            case 12: pts = regularPolygon(5, -90, 20, 22, 18);         ty = 26; break;   // pentagon (point up)
            case 20: // icosahedron: hexagon with a central triangle facet (VTT d20 icon)
              pts = [[20,3],[35.6,12],[35.6,30],[20,39],[4.4,30],[4.4,12]]; ty = 27;
              lines = ['20,3 4.4,30 35.6,30 20,3']; break;
            default: pts = regularPolygon(Math.min(s, 12), -90, 20, 21, 18); ty = 25;
          }
          return { pts: pts.map(p => p.join(',')).join(' '), ty, lines };
        };

        /* One die: shape by `sides`, colour by `variant`, tumbles + scrambles faces while
           `rolling`, then settles on `value`. */
        const ShapedDie = ({ sides, value, rolling, variant, size }) => {
          const [face, setFace] = useState(value);
          useEffect(() => {
            if (!rolling) { setFace(value); return; }
            const id = setInterval(() => setFace(1 + Math.floor(Math.random() * (parseInt(sides) || 20))), 70);
            return () => { clearInterval(id); setFace(value); };
          }, [rolling, value, sides]);
          const sh = dieShape(sides);
          const fillId = variant === 'hope' ? 'dieHope' : variant === 'fear' ? 'dieFear'
                       : variant === 'max' ? 'dieMax' : variant === 'crit' ? 'dieCrit' : 'dieNeutral';
          const stroke = variant === 'hope' ? '#22d3ee' : variant === 'fear' ? '#c084fc'
                       : variant === 'max' ? '#fde047' : variant === 'crit' ? '#f87171' : '#64748b';
          const txt = (variant === 'hope') ? '#062c33' : (variant === 'fear') ? '#2a0a45'
                       : (variant === 'max') ? '#3a2c00' : (variant === 'crit') ? '#3a0a0a' : '#e2e8f0';
          const px = size || 34;
          return (
            <span className={`vf-die3 ${rolling ? 'rolling' : ''}`} style={{ width: px, height: px }}>
              <svg viewBox="0 0 40 42" width={px} height={px}>
                <polygon points={sh.pts} fill={`url(#${fillId})`} stroke={stroke} strokeWidth="2" strokeLinejoin="round" />
                {(sh.lines || []).map((ln, i) => (
                  <polyline key={i} points={ln} fill="none" stroke={stroke} strokeWidth="1" strokeOpacity="0.55" strokeLinejoin="round" strokeLinecap="round" />
                ))}
                <text x="20" y={sh.ty} textAnchor="middle" fontWeight="900" fontSize="15" fill={txt} style={{ fontFamily: 'inherit' }}>{face}</text>
              </svg>
            </span>
          );
        };

        const normalizeDamageDiceResults = (results, rolls, discardedIndices, rerolls) => {
          if (Array.isArray(results) && results.length) {
            return results.map((die, index) => ({
              index: Number.isFinite(Number(die.index)) ? Number(die.index) : index,
              value: Number(die.value),
              status: die.status === 'discarded' ? 'discarded' : 'kept',
              rerolledFrom: die.rerolledFrom == null ? null : Number(die.rerolledFrom)
            }));
          }
          const dropped = new Set(Array.isArray(discardedIndices) ? discardedIndices.map(Number) : []);
          const rerollMap = new Map((Array.isArray(rerolls) ? rerolls : []).map(item => [Number(item.index), item]));
          return (Array.isArray(rolls) ? rolls : []).map((value, index) => {
            const reroll = rerollMap.get(index);
            return { index, value: Number(value), status: dropped.has(index) ? 'discarded' : 'kept', rerolledFrom: reroll ? Number(reroll.from) : null };
          });
        };

        const DamageDiceDisplay = ({ results, rolls, discardedIndices, rerolls, sides, rolling, compact }) => {
          const dice = normalizeDamageDiceResults(results, rolls, discardedIndices, rerolls);
          if (!dice.length) return null;
          const hasDiscarded = dice.some(die => die.status === 'discarded');
          const keptValues = dice.filter(die => die.status !== 'discarded').map(die => die.value);
          const discardedValues = dice.filter(die => die.status === 'discarded').map(die => die.value);
          return (
            <div className="flex flex-col items-center" aria-label={hasDiscarded ? `Kept ${keptValues.join(', ')}; discarded ${discardedValues.join(', ')}` : `Damage dice ${keptValues.join(', ')}`}>
              <div className="vf-damage-dice">
                {dice.map((die, index) => (
                  <div key={`${die.index}-${index}`} data-die-status={die.status} className={`vf-damage-die ${die.status === 'discarded' ? 'is-discarded' : 'is-kept'}`}>
                    <div className="vf-damage-die-face">
                      <ShapedDie sides={sides || 6} value={die.value} rolling={rolling} variant={die.status === 'discarded' ? 'neutral' : (die.value === 1 ? 'crit' : 'max')} size={compact ? 26 : 34} />
                    </div>
                    {hasDiscarded && <span className="vf-damage-die-state">{die.status === 'discarded' ? 'Drop' : 'Keep'}</span>}
                    {die.rerolledFrom != null && <span className="vf-damage-die-reroll">{die.rerolledFrom}→{die.value}</span>}
                  </div>
                ))}
              </div>
              {hasDiscarded && <div className="vf-damage-summary">Keep {keptValues.join(' + ')} · discard {discardedValues.join(', ')}</div>}
            </div>
          );
        };

        /* Number input with custom up/down chevrons (native browser spinners are hidden via CSS). */
        const NumField = ({ value, onChange, className, min, max, onClick, style, placeholder }) => {
          const full = /w-full/.test(className || '');
          const cur = () => { const n = parseFloat(value); return isNaN(n) ? 0 : n; };
          const clamp = (v) => { if (min !== undefined && min !== null && v < min) return min; if (max !== undefined && max !== null && v > max) return max; return v; };
          const bump = (d, e) => { e.preventDefault(); e.stopPropagation(); onChange({ target: { value: String(clamp(cur() + d)) } }); };
          return (
            <span className={`vf-num ${full ? 'vf-num-full' : ''}`}>
              <input type="number" value={value} onChange={onChange} min={min} max={max} placeholder={placeholder} style={style}
                onClick={(e) => { e.stopPropagation(); if (onClick) onClick(e); }} className={className} />
              <span className="vf-num-btns">
                <button type="button" tabIndex={-1} onMouseDown={(e) => bump(1, e)} aria-label="increase">▲</button>
                <button type="button" tabIndex={-1} onMouseDown={(e) => bump(-1, e)} aria-label="decrease">▼</button>
              </span>
            </span>
          );
        };

        /* Draggable handout popup (like the roller). Renders a structured note:
           title + subtitle headers, plain-text body, optional pasted table, with scroll.
           Handles its own auto-destruct countdown when the note has an expiry. */
        const NoteTable = ({ table }) => {
          if (!table || !Array.isArray(table.rows) || !table.rows.length) return null;
          const hdr = Array.isArray(table.headers) && table.headers.length ? table.headers : null;
          return (
            <table className="w-full text-[11px] border-collapse mt-2">
              {hdr && (<thead><tr>{hdr.map((h, i) => (<th key={i} className="text-left font-bold text-cyan-300 border-b border-slate-600 px-2 py-1 bg-slate-800/60">{h}</th>))}</tr></thead>)}
              <tbody>
                {table.rows.map((row, ri) => (
                  <tr key={ri} className={ri % 2 ? 'bg-slate-800/20' : ''}>
                    {row.map((cell, ci) => (<td key={ci} className="text-slate-200 border-b border-slate-800 px-2 py-1 align-top">{cell}</td>))}
                  </tr>
                ))}
              </tbody>
            </table>
          );
        };
        const NoteWindow = ({ open, pos, onDrag, onClose, onToggleMin, onSave, canSave }) => {
          const note = open.note || {};
          const [remaining, setRemaining] = useState(null);
          useEffect(() => {
            if (!note.expires || note.expires <= 0) { setRemaining(null); return; }
            let alive = true;
            const tick = () => {
              if (!alive) return;
              const rem = Math.max(0, (open.openedAt || Date.now()) + note.expires - Date.now());
              setRemaining(Math.ceil(rem / 1000));
              if (rem <= 0) { alive = false; onClose(); }
            };
            tick(); const iv = setInterval(tick, 500);
            return () => { alive = false; clearInterval(iv); };
          }, [note.id]);
          return (
            <div style={{ left: (pos && pos.x) || 60, top: (pos && pos.y) || 90 }} className="vf-note-win fixed z-40 bg-slate-900 border border-amber-700/60 rounded-xl w-full max-w-sm shadow-2xl window-shadow flex flex-col overflow-hidden">
              <div onMouseDown={(e) => onDrag(e, note.id)} onTouchStart={(e) => onDrag(e, note.id)} className="bg-gradient-to-r from-amber-950/60 to-slate-800/80 p-2.5 cursor-move flex justify-between items-center select-none border-b border-amber-800/40 touch-none">
                <h2 className="text-xs font-bold text-amber-200 flex items-center gap-2 pointer-events-none truncate"><ScrollText className="w-4 h-4 shrink-0" /> {note.title || 'Note'}</h2>
                <div className="flex items-center gap-1 shrink-0">
                  {remaining !== null && (<span className="text-[10px] font-mono font-bold text-red-300 bg-red-950/60 border border-red-800/50 rounded px-1.5 py-0.5 mr-1" title="Self-destructs">⏱ {remaining}s</span>)}

        const normalizeRuleName = (value) => String(value || '').toLowerCase().replace(/[+()]|\d+/g, ' ').replace(/[^a-z]+/g, ' ').trim();

          const repairShields = (fromIdx, toIdx) => {

          // --- LOGICA DUALITY ---

          const useSleeperAction = (label, resource, cost, doRoll) => {

          const rollWeaponDamage = (dmgStr, mult, bonus, profile) => {

              const match = String(dmgStr).match(/(\d*)d(\d+)\s*([+-]\s*\d+)?/i);
              if (!match) return null;
              const baseCount = parseInt(match[1] || '1', 10) || 1;
              const sides = parseInt(match[2], 10);
              const keptCount = baseCount * mult;
              const rolledCount = keptCount + (profile.massive ? 1 : 0);
              const staticMod = match[3] ? parseInt(match[3].replace(/\s/g, ''), 10) : 0;
              const rolls = [], rerolls = [];
              for (let index = 0; index < rolledCount; index++) {

          const traitModForWeapon = (traitStr) => { if (!traitStr) return 0; var tt=String(traitStr).toLowerCase(); var ks=['agility','strength','finesse','instinct','presence','knowledge']; for (var n=0;n<ks.length;n++){ if (tt.indexOf(ks[n])!==-1) return (parseInt(character.stats && character.stats[ks[n]], 10) || 0); } return 0; };
          const rollDuality = (opts) => {

                  else { const hope = charUpd.hope || {current:0,max:6}; charUpd = {...charUpd, hope: {...hope, current: Math.min((hope.max||6), (hope.current||0)+1)}}; charChanged = true; }

              const resultObj = {
                  hope: hopeDie, fear: fearDie, extra: extraDie, rollType: effectiveRollType,

              const notationParts = ['1d12', '1d12'];

          const TIME_TRAVEL_KEY = 'veilfarers_player_time_travel_v1';
          const readTimeTravel = () => { try { return JSON.parse(localStorage.getItem(TIME_TRAVEL_KEY) || '{}') || {}; } catch (e) { return {}; } };
          const saveTimeTravelSnapshot = (eventId, stateBefore, label) => {
              if (!eventId || !stateBefore || !stateBefore.id) return;
              try {
                const all = readTimeTravel();
                all[eventId] = { characterId:stateBefore.id, timestamp:Date.now(), label:label || 'Roll', character:JSON.parse(JSON.stringify(stateBefore)) };
                const entries = Object.entries(all).sort((a,b) => Number(b[1].timestamp) - Number(a[1].timestamp)).slice(0, 40);

          const loadFromFile = (event) => { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (e) => { try { const loadedData = JSON.parse(e.target.result); if (loadedData && loadedData.fields && window.veilfarersImportCreator) { const mapped = window.veilfarersImportCreator(loadedData); if (mapped) { const withId = { ...mapped, id: mapped.id || mkCharId() }; const isDefaultOnly = characters.length === 1 && (!characters[0] || !characters[0].name); if (isDefaultOnly) { setCharacters([withId]); setActiveTab(0); } else { setCharacters([...characters, withId]); setActiveTab(characters.length); } event.target.value=''; return; } } if (loadedData && !Array.isArray(loadedData) && window.veilfarersImportCreatorState) { const mappedState = window.veilfarersImportCreatorState(loadedData, VF_CANON); if (mappedState) { const withId = { ...mappedState, id: mappedState.id || mkCharId() }; const isDefaultOnly = characters.length === 1 && (!characters[0] || !characters[0].name); if (isDefaultOnly) { setCharacters([withId]); setActiveTab(0); } else { setCharacters([...characters, withId]); setActiveTab(characters.length); } event.target.value=''; return; } } if (Array.isArray(loadedData)) { setCharacters(ensureIds(loadedData)); setActiveTab(0); } else { setCharacters(ensureIds([loadedData])); setActiveTab(0); } } catch (err) { showAlert("Error loading file: Invalid JSON format"); } }; reader.readAsText(file); event.target.value = ''; };

          // --- FIREBASE LOGIC UPDATED ---
          const fetchTables = async () => {

              return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');

          const connectToCloud = async () => {
              setErrorMsg('');

          // --- GESTIÓN LOCAL (Helpers) ---
          const updateCharacter = (updates) => { lastLocalEditRef.current = Date.now(); setCharacters(prev => { const newChars = [...prev]; const currentVal = newChars[activeTab]; const newVal = typeof updates === 'function' ? updates(currentVal) : { ...currentVal, ...updates }; newChars[activeTab] = newVal; return newChars; }); };

          const handleStatChange = (stat, value) => updateCharacter(prev => ({ ...prev, stats: { ...prev.stats, [stat]: parseInt(value) || 0 } }));

          const equippedWeapons = (character.weapons || []).map(hydratePlayerWeapon).filter(weapon => weapon.name);

                                  <button onClick={() => setShowRoller(false)} title="Close" className="p-1 rounded hover:bg-red-900/50 text-slate-400 hover:text-red-400"><X className="w-3 h-3" /></button>
                              </div>
                          </div>
                          
                          {/* BODY - HIDDEN IF MINIMIZED */}
                          {!minimized.player && (
                              <div className="p-4 bg-slate-900">

                                      <button onClick={() => setPlayerRollerMode('standard')} className={`flex-1 py-1 text-xs font-bold rounded uppercase ${playerRollerMode === 'standard' ? 'bg-slate-800 text-white shadow' : 'text-slate-500 hover:text-slate-300'}`}>Standard Dice</button>
                                  </div>

                                  {playerRollerMode === 'duality' ? (
                                    <>
                                        <div className="flex justify-center gap-2 mb-4">

                                            <button onClick={() => setPlayerRollType('normal')} className={`px-3 py-1 text-xs font-bold rounded border ${playerRollType === 'normal' ? 'bg-slate-800 border-slate-500 text-white' : 'bg-slate-950 border-slate-800 text-slate-500'}`}>NORM</button>
                                            <button onClick={() => setPlayerRollType('advantage')} className={`px-3 py-1 text-xs font-bold rounded border ${playerRollType === 'advantage' ? 'bg-green-900 border-green-500 text-white' : 'bg-slate-950 border-slate-800 text-slate-500'}`}>ADV</button>

                                                <span className={`text-xs font-bold uppercase mb-1 ${rollResult.rollType === 'advantage' ? 'text-green-400' : 'text-red-400'}`}>{rollResult.rollType === 'advantage' ? 'ADV' : 'DIS'}</span>

                  </div>

              {/* ROLLER 2: GM DICE TRAY (FLOATING WINDOW) */}
              {showDiceTray && (
                   <div style={{ left: positions.gm.x, top: positions.gm.y }}
                        className="fixed z-50 bg-slate-900 border border-yellow-600 rounded-xl w-full max-w-sm shadow-2xl window-shadow flex flex-col overflow-hidden">
                          
                          {/* HEADER */}
                          <div onMouseDown={(e) => startDrag(e, 'gm')} onTouchStart={(e) => startDrag(e, 'gm')} className="bg-slate-800/80 p-3 cursor-move flex justify-between items-center select-none border-b border-yellow-600/30 touch-none">

                                  <button onClick={() => setPinned(p => ({...p, gm: !p.gm}))} title="Pin Window" className={`p-1 rounded hover:bg-slate-700 ${pinned.gm ? 'text-yellow-400' : 'text-slate-500'}`}><Pin className="w-3 h-3" /></button>

                            <h2 className="text-[9px] font-bold uppercase text-slate-500 mb-2 tracking-widest flex items-center gap-1">
                                <Shield className="w-3 h-3 text-slate-600" /> Armour Threshold
                            </h2>
                            <div className="flex items-center justify-between bg-slate-950/50 p-2 rounded border border-slate-800">
                                <div className="flex flex-col items-center flex-1">
                                     <span className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Minor</span>
                                     <span className="text-[8px] font-bold text-red-400 uppercase mt-0.5">1 HP</span>
                                </div>
                                <div className="flex items-center justify-center px-2">
                                    <NumField className="bg-slate-900 border border-slate-700 rounded w-12 text-center text-lg font-bold text-white outline-none focus:border-cyan-500" value={character.thresholds.major || 0} onChange={e => updateCharacter({...character, thresholds: {...character.thresholds, major: parseInt(e.target.value)}})} />
                                </div>
                                <div className="flex flex-col items-center flex-1">
                                     <span className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Major</span>
                                     <span className="text-[8px] font-bold text-red-500 uppercase mt-0.5">2 HP</span>
                                </div>
                                <div className="flex items-center justify-center px-2">
                                    <NumField className="bg-slate-900 border border-slate-700 rounded w-12 text-center text-lg font-bold text-white outline-none focus:border-cyan-500" value={character.thresholds.severe || 0} onChange={e => updateCharacter({...character, thresholds: {...character.thresholds, severe: parseInt(e.target.value)}})} />
                                </div>
                                <div className="flex flex-col items-center flex-1">
                                     <span className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Severe</span>
                                     <span className="text-[8px] font-bold text-red-600 uppercase mt-0.5">3 HP</span>
                                </div>
                            </div>
                       </div>

                       <button onClick={() => updateCharacter({...character, path: (character.path === 'sleeping' ? 'awakened' : 'sleeping')})} className="text-[9px] font-bold uppercase tracking-wider px-2 py-1 rounded border border-slate-700 text-amber-400 hover:border-amber-500 mb-1 w-full">Path: {character.path === 'sleeping' ? 'Sleeping' : 'Awakened'} &middot; switch</button>
                       <div className="grid grid-cols-1 gap-1">
                         <ResourceTrack label="Health" current={character.hp.current} max={character.hp.max} cap={12} color="red" icon={Heart} onChange={(v) => updateCharacter({...character, hp: {...character.hp, current: v}})} />
                         <ResourceTrack label="Stress" current={character.stress.current} max={character.stress.max} cap={10} color="pink" icon={AlertCircle} onChange={(v) => updateCharacter({...character, stress: {...character.stress, current: v}})} />
                         {(character.path === 'sleeping') ? (
                           <>
                             <ResourceTrack label="Effort" current={(character.effort||{current:0}).current} max={(character.effort||{max:6}).max} color="amber" icon={Zap} onChange={(v) => updateCharacter({...character, effort: {...(character.effort||{max:6,current:0}), current: v}})} />
                             <ResourceTrack label="Resolve" current={(character.resolve||{current:0}).current} max={(character.resolve||{max:2}).max} cap={6} color="cyan" icon={Shield} onChange={(v) => updateCharacter({...character, resolve: {...(character.resolve||{max:2,current:0}), current: v}})} />
                           </>
                         ) : (
                           <ResourceTrack label="Hope" current={character.hope.current} max={character.hope.max} color="amber" icon={Sparkles} onChange={(v) => updateCharacter({...character, hope: {...character.hope, current: v}})} />
                         )}
                       </div>
                       
                       {/* OPERATIONAL FEATURES / KIT */}
                       {(character.ancestryGift || character.communityGift || character.features || character.classFeature) && (
                         <div className="grid grid-cols-1 xl:grid-cols-2 gap-2">
                           {character.ancestryGift && <FeatureSummaryCard kind="ancestry" text={character.ancestryGift} />}
                           {character.classFeature && <FeatureSummaryCard kind="class" text={character.classFeature} />}
                           {character.communityGift && <FeatureSummaryCard kind="community" text={character.communityGift} />}
                           {character.features && <FeatureSummaryCard kind="effort" text={character.features} />}
                         </div>
                       )}
                       {((character.augments && character.augments.length) || (character.drones && character.drones.length)) && (
                         <div className="bg-slate-900/40 rounded border border-slate-800 p-2 text-[9px] text-slate-300 grid grid-cols-1 xl:grid-cols-2 gap-2">
                           {character.augments && character.augments.length > 0 && (<div><span className="text-cyan-400 font-bold uppercase tracking-wider">Augmentations</span>{character.augments.map((a,i)=>(<div key={i} className="text-slate-300 mt-1"><span className="font-bold text-slate-100">{a.name}</span> <span className="text-slate-500">{a.tier}</span><div className="text-slate-400 leading-snug">{a.benefit}</div></div>))}</div>)}
                           {character.drones && character.drones.length > 0 && (<div><span className="text-purple-400 font-bold uppercase tracking-wider">Drones</span>{character.drones.map((d,i)=>(<div key={i} className="text-slate-300 mt-1"><span className="font-bold text-slate-100">{d.name}</span> <span className="text-slate-500">{d.grade}</span> · HP {d.hp} · Ev {d.evasion}</div>))}</div>)}
                         </div>
                       )}

                       {/* ACTIONS / CARDS (path-aware) */}
                       {(character.path === 'sleeping') ? (
                       <div className="grid grid-cols-1 xl:grid-cols-2 gap-2 flex-grow items-start">
                         <CompactActionPanel panelId="sleeper-actions" title="Sleeper Actions" description="General Effort techniques available to every Sleeping character. Expand to choose an action." icon={<Zap className="w-4 h-4" />} accentClass="text-amber-400">
                           <div className="space-y-1.5 mt-3">
                             {GENERAL_EFFORT.map((ef, i) => (
                               <div key={i} className="rounded border border-slate-800 bg-slate-950/45 p-2 flex items-start gap-2">
                                 <button disabled={(((character.effort&&character.effort.current)||0) < ef.cost)} onClick={() => useSleeperAction('Effort: ' + ef.name, 'effort', ef.cost, ef.roll)} title={ef.text} className="px-2 py-1 text-[9px] font-black rounded border border-amber-800/60 text-amber-300 hover:border-amber-500 disabled:opacity-30 disabled:cursor-not-allowed shrink-0">{ef.roll ? 'Roll' : 'Use'} · {ef.cost}</button>
                                 <div className="min-w-0"><div className="text-[11px] font-bold text-amber-100">{ef.name}</div><div className="text-[10px] text-slate-400 leading-snug mt-0.5">{ef.text}</div></div>
                               </div>
                             ))}
                           </div>
                         </CompactActionPanel>
                         <CompactActionPanel panelId="resolve-moves" title="Resolve Moves" description={`${character.class || 'Class'}${character.subclass ? ' · ' + character.subclass : ''}. Class and subclass signature moves paid with Resolve.`} icon={<Shield className="w-4 h-4" />} accentClass="text-cyan-400">
                           <div className="space-y-2 mt-3">
                             {availableResolveMoves.length > 0 ? availableResolveMoves.map((move) => {
                               const minimum = resolveMoveMinimum(move);
                               const disabled = Number((character.resolve && character.resolve.current) || 0) < minimum;
                               return (
                                 <div key={move.id} className="rounded border border-cyan-950/80 bg-cyan-950/10 p-2.5">
                                   <div className="flex items-start justify-between gap-2">
                                     <div className="min-w-0">
                                       <div className="flex flex-wrap items-center gap-1.5"><span className="text-[11px] font-black text-cyan-100">{move.name}</span><span className="px-1.5 py-0.5 rounded border border-cyan-900/60 bg-slate-950 text-[8px] font-black uppercase text-cyan-400">{move.subclass || 'Class'}</span></div>
                                       <div className="mt-1 text-[9px] font-black uppercase tracking-wide text-slate-500">{move.cost}</div>
                                     </div>
                                     <button disabled={disabled} onClick={() => useResolveMove(move)} className="shrink-0 px-2.5 py-1.5 rounded border border-cyan-700/60 bg-cyan-950/30 text-[9px] font-black uppercase text-cyan-300 hover:border-cyan-400 disabled:opacity-30 disabled:cursor-not-allowed">{move.rollResolve ? 'Roll' : 'Use'}</button>
                                   </div>
                                   <div className="mt-1.5 text-[10px] leading-relaxed text-slate-300">{move.text}</div>
                                 </div>
                               );
                             }) : <div className="rounded border border-dashed border-slate-700 p-3 text-[10px] text-slate-500">No Resolve Moves are available for this class in the loaded rules data.</div>}
                           </div>
                         </CompactActionPanel>
                       </div>
                       ) : (
                       <div className="bg-slate-900/40 rounded border border-slate-800 p-2 flex-grow min-h-[150px]">
                           <div className="flex justify-between items-center mb-2">
                               <h2 className="text-[9px] font-bold uppercase text-slate-500 tracking-widest flex items-center gap-1"><CreditCard className="w-3 h-3 text-emerald-500" /> Active Cards</h2>
                               <button onClick={() => setShowCardManager(true)} className="text-[9px] text-emerald-400 hover:text-white uppercase font-bold">+ Manage</button>
                           </div>
                           <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                               {character.domainCards && character.domainCards.map((card, idx) => (<DomainCard key={idx} card={card} onDelete={() => removeCard(idx)} />))}
                               {(!character.domainCards || character.domainCards.length === 0) && (<div className="col-span-full text-center py-4 text-xs text-slate-600 italic">No domain cards equipped</div>)}
                           </div>
                       </div>
                       )}
                    </div>

                    {/* COL 3: GEAR */}
                    <div className="col-span-12 md:col-span-12 lg:col-span-4 flex flex-col gap-2">
                       <div className="bg-slate-900/40 rounded border border-slate-800 p-2">
                         <h2 className="text-[9px] font-bold uppercase text-slate-500 mb-2 flex items-center gap-1 tracking-wider"><Star className="w-3 h-3 text-purple-500" /> Experiences</h2>
                         <div className="space-y-1">
                           {(character.experiences || []).map((exp, i) => (
                             <div key={i} className="flex gap-1 items-stretch h-6">
                               <div className="w-6 bg-slate-950 border border-slate-700 rounded flex items-center justify-center shrink-0"><NumField className="w-full h-full bg-transparent text-center font-bold text-purple-400 outline-none text-xs" value={exp.bonus} onChange={(e) => handleExperienceChange(i, 'bonus', parseInt(e.target.value))} /></div>
                               <input type="text" className="flex-grow bg-slate-900/50 border-b border-slate-800 text-[10px] px-2 outline-none text-slate-300 focus:border-purple-500/50 transition-colors" placeholder="Experience..." value={exp.description} onChange={(e) => handleExperienceChange(i, 'description', e.target.value)} /><button disabled={character.path !== 'sleeping' && (((character.hope&&character.hope.current)||0) < 1)} onClick={() => rollDuality({label: 'Exp: ' + (exp.description || 'Experience'), extraMod: parseInt(exp.bonus)||0, spend: (character.path === 'sleeping' ? null : {resource: 'hope', amount: 1})})} title="Roll with this experience (awakened spends 1 Hope; free for sleepers)" className="px-1 bg-slate-950 border border-slate-700 rounded flex items-center justify-center shrink-0 hover:border-purple-500 text-purple-400 disabled:opacity-30 disabled:cursor-not-allowed"><Zap className="w-3 h-3" /></button>
                             </div>
                           ))}
                         </div>
                       </div>
                       <div className="bg-slate-900/40 rounded border border-slate-800 p-2">
                         <div className="flex items-center justify-between gap-2 mb-2">
                           <div><h2 className="text-[9px] font-bold uppercase text-slate-500 flex items-center gap-1 tracking-wider"><Zap className="w-3 h-3 text-yellow-500" /> Weapons</h2><div className="text-[8px] text-slate-600 mt-0.5">{equippedWeapons.length} equipped · {arsenalWeapons.length} in arsenal</div></div>
                           <button onClick={() => setShowWeaponManager(true)} className="px-2.5 py-1 rounded border border-yellow-600/40 bg-yellow-950/20 text-yellow-300 text-[9px] font-black uppercase hover:border-yellow-500">Loadout</button>
                         </div>
                         <div className="space-y-2">
                           {equippedWeapons.map(weapon => <WeaponCard key={weaponKey(weapon)} weapon={weapon} />)}
                           {!equippedWeapons.length && <button onClick={() => setShowWeaponManager(true)} className="w-full rounded-lg border border-dashed border-slate-700 bg-slate-950/30 p-4 text-[10px] text-slate-500 hover:border-yellow-600/60 hover:text-yellow-300">No weapon equipped. Open Loadout to equip one or more weapons.</button>}
                         </div>
                       </div>
                       <div className="bg-slate-900/40 rounded border border-slate-800 p-2 flex-grow">
                         <div className="flex gap-2 mb-2">
                           <div className="flex-1 bg-slate-950 rounded border border-slate-800 px-2 py-1"><label className="text-[8px] text-slate-500 uppercase block font-bold">Wealth</label><NumField className="w-full bg-transparent text-center font-bold text-xs text-blue-400 outline-none" value={character.wealth} onChange={e => updateCharacter({...character, wealth: e.target.value})} /></div>
                           <div className="flex-1 bg-slate-950 rounded border border-slate-800 px-2 py-1"><label className="text-[8px] text-slate-500 uppercase block font-bold">Credits</label><NumField className="w-full bg-transparent text-center font-bold text-xs text-blue-400 outline-none" value={character.credits} onChange={e => updateCharacter({...character, credits: e.target.value})} /></div>
                         </div>
                         <h2 className="text-[9px] font-bold uppercase text-slate-500 mb-1 tracking-wider"><Database className="w-3 h-3 text-blue-500 inline mr-1" /> Inventory</h2>
                         <div className="grid grid-cols-1 gap-1">
                           {(character.inventory || []).map((item, i) => (
                             <div key={i} className="flex gap-2 items-center h-5">
                               <span className="text-slate-700 text-[9px] font-mono w-3">{i+1}</span>
                               <input type="text" className="flex-grow bg-transparent border-b border-slate-800/50 focus:border-blue-500/50 text-[10px] outline-none text-slate-400" value={item} onChange={(e) => { const newInv = [...character.inventory]; newInv[i] = e.target.value; updateCharacter({...character, inventory: newInv}); }} />
                             </div>
                           ))}
                         </div>
                       </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CharacterSheet />);
        }).catch(function(error){
          console.error('Canonical rules failed to load:', error);
          document.getElementById('root').innerHTML = '<div style="max-width:720px;margin:80px auto;padding:24px;border:1px solid #7f1d1d;border-radius:12px;background:#1f0a0a;color:#fecaca;font-family:system-ui">Player Tool could not load the canonical RC3 rules data. Check that the <code>/rules-data</code> folder was deployed.</div>';
        });
    </script>
  <script src="portal.js"></script>
</body>
</html>
