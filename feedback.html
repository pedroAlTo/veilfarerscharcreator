<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback · VeilFarers</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="module.css"></head><body><main class="vf-shell"><header class="vf-hero"><div><div class="vf-eyebrow">Playtest & Portal Feedback</div><h1>Feedback</h1><p class="vf-lead">Submit rules issues, data mismatches, tool bugs or usability observations. The static form is registered through Netlify Forms and does not require Firebase.</p></div></header><section class="vf-panel vf-content"><form class="vf-form" name="veilfarers-feedback" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/feedback.html?submitted=1"><input type="hidden" name="form-name" value="veilfarers-feedback"><p class="vf-hidden"><label>Do not fill this out: <input name="bot-field"></label></p><div class="vf-field"><label for="feedback-type">Category</label><select id="feedback-type" name="category" required><option value="">Choose one</option><option>Rules inconsistency</option><option>Canonical data issue</option><option>Character Creator</option><option>Card Library</option><option>Charsheet / Level Up</option><option>Player Tool</option><option>Keeper Tool</option><option>Inventory</option><option>Downloads</option><option>Accessibility / UX</option></select></div><div class="vf-field"><label for="feedback-email">Email (optional)</label><input id="feedback-email" name="email" type="email" autocomplete="email"></div><div class="vf-field"><label for="feedback-message">Details</label><textarea id="feedback-message" name="message" required placeholder="Describe what happened, what you expected, and the relevant rule or tool section."></textarea></div><div class="vf-field"><label for="feedback-version">Version / page</label><input id="feedback-version" name="version" value="11.1 RC2 · v59.2"></div><div class="vf-actions"><button class="vf-button primary" type="submit">Submit feedback</button></div></form><p class="vf-status vf-hidden" id="feedback-success">Feedback submitted. Thank you.</p></section></main><script>if(new URLSearchParams(location.search).get('submitted')){document.querySelector('form').classList.add('vf-hidden');document.getElementById('feedback-success').classList.remove('vf-hidden');document.getElementById('feedback-success').classList.add('ok');}</script><script src="portal.js"></script></body></html>
